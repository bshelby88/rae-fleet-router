name: Deploy to Fly

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'bshelby88/rae-fleet-router' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify web health after deploy
        run: |
          timeout 90 bash -c 'until curl -fsS -m 5 https://rae-fleet-router.fly.dev/health; do sleep 5; done' && echo "Health OK: responded within 90s" || { echo "::error::rae-fleet-router did not respond on /health within 90s of deploy"; exit 1; }