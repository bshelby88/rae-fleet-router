app = "rae-fleet-router"


[env]
  PORT = "3000"
  X402_PAY_TO = "0x7861db4efc14a1ed5dd8c96c528a3796560f1393"

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 3000
  protocol = "tcp"
  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
  [[services.checks]]
    interval = "15s"
    grace_period = "5s"
    method = "get"
    path = "/health"
    timeout = "2s"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
